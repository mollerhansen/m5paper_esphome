alias: "M5Stack: Opdater Status og Alarmer"
description: "Overvåger sensorer og opdaterer status_text og status_icon på M5Paper"
mode: restart

trigger:
  # Tjek hvert 5. minut eller når en kritisk sensor ændrer sig
  - platform: time_pattern
    minutes: "/5"
  - platform: state
    entity_id: 
      - sensor.living_room_carbon_dioxide
      - lock.kaelderdor
  - platform: time
    at: "22:00:00"

action:
  - choose:
      # 1. PRIORITY: CO2 ALARM (> 1200 ppm)
      - conditions:
          - condition: numeric_state
            entity_id: sensor.living_room_carbon_dioxide
            above: 1200
        sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.m5paper_status_icon
            data:
              value: "🪟"
          - action: input_text.set_value
            target:
              entity_id: input_text.m5paper_status_text
            data:
              value: "Høj CO2 | Luft ud!"

      # 2. PRIORITY: KÆLDERDØR LÅST OP OM NATTEN (KL 22-06)
      - conditions:
          - condition: time
            after: "22:00:00"
            before: "06:00:00"
          - condition: state
            entity_id: lock.kaelderdor
            state: "unlocked"
        sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.m5paper_status_icon
            data:
              value: "🔓"
          - action: input_text.set_value
            target:
              entity_id: input_text.m5paper_status_text
            data:
              value: "Kælderdør åben | Lås kælderdør"

      # 3. PRIORITY: VASKEMASKINE FÆRDIG
      - conditions:
          - condition: numeric_state
            entity_id: sensor.vaskemaskine_power
            above: 2
            below: 10
        sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.m5paper_status_icon
            data:
              value: "👕"
          - action: input_text.set_value
            target:
              entity_id: input_text.m5paper_status_text
            data:
              value: "Vask Slut | Tøm Vaskemaskinen!"

      # DEFAULT: ALT ER OK
      - conditions: []
        sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.m5paper_status_icon
            data:
              value: "🏠"
          - action: input_text.set_value
            target:
              entity_id: input_text.m5paper_status_text
            data:
              value: "Klar"
