time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - bm8563.write_time:
          id: rtc_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 22
        then:
          - lambda: "// Logic moved to Home Assistant"
  - platform: bm8563
    id: rtc_time
    sleep_duration: 1h

globals:
  - id: big_alert_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_touch_time
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: power_down_request
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: show_weather_forecast
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_alert_text
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: last_header_text
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: last_alert_icon
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: last_status_time
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: target_temp_stue
    type: float
    restore_value: no
    initial_value: '21.0'
  - id: target_temp_kokken
    type: float
    restore_value: no
    initial_value: '21.0'
  - id: target_temp_bad
    type: float
    restore_value: no
    initial_value: '21.0'

script:
  - id: trigger_big_alert
    mode: restart
    then:
      - lambda: 'id(big_alert_active) = true;'
      - component.update: m5paper_display

  - id: run_house_power_down
    then:
      - homeassistant.service:
          service: script.house_power_down
      - lambda: 'id(power_down_request) = false;'
      - component.update: m5paper_display

  - id: run_ventilate_stuen
    then:
      - homeassistant.service:
          service: script.m5paper_ventilate_stuen
      - lambda: |-
          id(big_alert_active) = true;
          id(last_header_text) = "Lufter ud";
          id(last_alert_text) = "Lufter ud i stuen";
          id(last_alert_icon) = "🪟";
      - component.update: m5paper_display

  - id: set_climate_temp
    mode: parallel
    parameters:
      entity_id: string
      target_temp: float
    then:
      - homeassistant.service:
          service: script.m5paper_set_temp
          data:
            entity_id: !lambda "return entity_id;"
            target_temp: !lambda "return to_string(target_temp);"

  - id: toggle_climate_mode
    mode: parallel
    parameters:
      entity_id: string
      current_mode: string
    then:
      - homeassistant.service:
          service: script.m5paper_toggle_climate
          data:
            entity_id: !lambda "return entity_id;"
            current_mode: !lambda "return current_mode;"

  - id: power_down_timeout
    mode: restart
    then:
      - delay: 30s
      - lambda: |-
          if (id(power_down_request)) {
            id(power_down_request) = false;
            id(m5paper_display).update();
          }

  - id: weather_forecast_timeout
    mode: restart
    then:
      - delay: 30s
      - lambda: |-
          if (id(show_weather_forecast)) {
            id(show_weather_forecast) = false;
            id(m5paper_display).update();
          }

sensor:
  - platform: homeassistant
    entity_id: sensor.living_room_carbon_dioxide
    id: co2_level

  - platform: homeassistant
    entity_id: sensor.vaskemaskine_power
    id: washer_power

  - platform: homeassistant
    entity_id: sensor.bedroom_temperature
    id: temp_1st_sal
  - platform: homeassistant
    entity_id: sensor.bedroom_volatile_organic_compounds_parts
    id: bedroom_voc

  # --- Climate Sensors ---
  - platform: homeassistant
    entity_id: climate.stuen_radiators
    attribute: current_temperature
    id: temp_stuen
  - platform: homeassistant
    entity_id: climate.stuen_radiators
    attribute: temperature
    id: climate_stue_target
    on_value:
      then:
        - lambda: 'id(target_temp_stue) = x;'
  - platform: homeassistant
    entity_id: climate.radiator_kokken
    attribute: current_temperature
    id: temp_kokken
  - platform: homeassistant
    entity_id: climate.radiator_kokken
    attribute: temperature
    id: climate_kokken_target
    on_value:
      then:
        - lambda: 'id(target_temp_kokken) = x;'
  - platform: homeassistant
    entity_id: climate.gulvvarme_termostat
    attribute: current_temperature
    id: temp_bad
  - platform: homeassistant
    entity_id: climate.gulvvarme_termostat
    attribute: temperature
    id: climate_bad_target
    on_value:
      then:
        - lambda: 'id(target_temp_bad) = x;'

  - platform: homeassistant
    entity_id: weather.forecast_home
    attribute: temperature
    id: temp_outdoor
  - platform: homeassistant
    entity_id: sensor.weather_temp_1h
    id: temp_1h
  - platform: homeassistant
    entity_id: sensor.weather_temp_2h
    id: temp_2h
  - platform: homeassistant
    entity_id: sensor.weather_temp_3h
    id: temp_3h

  - platform: sht3xd
    temperature:
      id: local_temp
      name: "M5Paper Temperature"
    humidity:
      id: local_humidity
      name: "M5Paper Humidity"
    address: 0x44
    update_interval: 60s

  - platform: adc
    pin: GPIO35
    name: "M5Paper Battery Voltage"
    id: battery_voltage
    update_interval: 60s
    unit_of_measurement: "V"
    device_class: voltage
    filters:
      - multiply: 2.0

touchscreen:
  - platform: gt911
    id: m5paper_touchscreen
    display: m5paper_display
    interrupt_pin: GPIO36
    on_touch:
      - lambda: |-
          // Debounce: Ignore touches within 1s of last touch
          uint32_t now = millis();
          if (now - id(last_touch_time) < 1000) return;
          id(last_touch_time) = now;

          ESP_LOGI("touch", "Touch at x=%d, y=%d", touch.x, touch.y);
          
          if (id(power_down_request)) {
            if (touch.y > 640) {
               id(run_house_power_down).execute();
            } else {
               id(power_down_request) = false;
               id(m5paper_display).update();
            }
            return;
          }

          // 1. Dismiss big alert if active
          if (id(big_alert_active) && touch.y > 640) {
            id(big_alert_active) = false;
            id(m5paper_display).update();
            return;
          }

          // --- Climate Controls (Only on page_stuen) ---
          if (id(m5paper_display).get_active_page() == id(page_stuen)) {
            // Ventilate Button (Bottom left)
            if (touch.y > 800 && touch.x < 250) {
              id(run_ventilate_stuen).execute();
              return;
            }

            auto handle_climate = [&](const char* entity, float& target, const std::string& mode, int y_start) {
              if (touch.y >= y_start && touch.y <= y_start + 165) {
                if (touch.x < 160) {
                  target -= 0.5;
                  id(set_climate_temp).execute(entity, target);
                  id(m5paper_display).update();
                } else if (touch.x > 380) {
                  target += 0.5;
                  id(set_climate_temp).execute(entity, target);
                  id(m5paper_display).update();
                } else if (touch.x > 160 && touch.x < 380 && touch.y > y_start + 100) {
                  id(toggle_climate_mode).execute(entity, mode);
                  id(m5paper_display).update();
                }
                return true;
              }
              return false;
            };

            if (handle_climate("climate.stuen_radiators", id(target_temp_stue), id(climate_stue_mode).state, 260)) return;
            if (handle_climate("climate.radiator_kokken", id(target_temp_kokken), id(climate_kokken_mode).state, 435)) return;
            if (handle_climate("climate.gulvvarme_termostat", id(target_temp_bad), id(climate_bad_mode).state, 610)) return;
          }

          // 2. Toggle weather ON if touched in the bottom area (y > 460)
          if (touch.y > 460) {
            if (!id(show_weather_forecast)) {
               id(show_weather_forecast) = true;
               id(weather_forecast_timeout).execute();
               id(m5paper_display).update();
            }
            return;
          }

          // 3. Manual cancel weather if touched anywhere else
          if (id(show_weather_forecast)) {
            id(show_weather_forecast) = false;
            id(weather_forecast_timeout).stop();
            id(m5paper_display).update();
            return;
          }

          // 4. Refresh screen if top right is touched
          if (touch.x > 400 && touch.y < 100) {
            id(m5paper_display).update();
          }


text_sensor:
  - platform: homeassistant
    entity_id: sensor.kaelderdor_operator
    id: lock_operator

  - platform: homeassistant
    entity_id: climate.stuen_radiators
    id: climate_stue_mode
  - platform: homeassistant
    entity_id: climate.radiator_kokken
    id: climate_kokken_mode
  - platform: homeassistant
    entity_id: climate.gulvvarme_termostat
    id: climate_bad_mode

  - platform: homeassistant
    entity_id: input_text.m5paper_status_icon
    id: status_icon
  - platform: homeassistant
    entity_id: input_text.m5paper_status_text
    id: status_text
    on_value:
      then:
        - lambda: |-
            std::string msg = x;
            if (msg == "Alt er Slukket. Godnat.") msg = "Godnat";
            
            if (msg != "Klar" && msg != "unknown" && !msg.empty()) {
              size_t sep = msg.find('|');
              if (sep != std::string::npos) {
                std::string header = msg.substr(0, sep);
                std::string alert = msg.substr(sep + 1);
                
                // Trim whitespace
                header.erase(header.find_last_not_of(" \t\n\r") + 1);
                header.erase(0, header.find_first_not_of(" \t\n\r"));
                alert.erase(alert.find_last_not_of(" \t\n\r") + 1);
                alert.erase(0, alert.find_first_not_of(" \t\n\r"));
                
                id(last_header_text) = header;
                id(last_alert_text) = alert;
              } else {
                id(last_header_text) = msg;
                id(last_alert_text) = msg;
              }
              
              id(big_alert_active) = true;
              id(last_status_time) = id(ha_time).now().strftime("(%H:%M)");
              if (id(status_icon).has_state()) id(last_alert_icon) = id(status_icon).state;
              id(m5paper_display).update();
            } else if (msg == "Klar") {
              id(last_header_text) = "";
              id(last_alert_icon) = "🏠";
              id(big_alert_active) = false;
              id(m5paper_display).update();
            }

  - platform: homeassistant
    entity_id: sensor.weather_icon_1h
    id: icon_1h
  - platform: homeassistant
    entity_id: sensor.weather_icon_2h
    id: icon_2h
  - platform: homeassistant
    entity_id: sensor.weather_icon_3h
    id: icon_3h
  - platform: homeassistant
    entity_id: input_text.m5paper_cal_today
    id: cal_today
  - platform: homeassistant
    entity_id: input_text.m5paper_cal_week
    id: cal_week
  - platform: homeassistant
    entity_id: input_text.m5paper_weather_5day
    id: weather_5day

m5paper:
  id: m5paper_board
  main_power_pin: GPIO2
  battery_power_pin: GPIO5

binary_sensor:
  - platform: gpio
    id: rocker_up
    pin: {number: GPIO37, inverted: true}
    on_press:
      - display.page.show_previous: m5paper_display
      - component.update: m5paper_display
  - platform: gpio
    id: rocker_down
    pin: {number: GPIO39, inverted: true}
    on_press:
      - display.page.show_next: m5paper_display
      - component.update: m5paper_display
  - platform: gpio
    id: rocker_center
    pin: {number: GPIO38, inverted: true}
    on_press:
      - lambda: |-
          id(power_down_request) = true;
          id(power_down_timeout).execute();
          id(m5paper_display).update();
    on_click:
      min_length: 1s
      max_length: 10s
      then:
        - bm8563.apply_sleep_duration: rtc_time
        - m5paper.shutdown_main_power: m5paper_board

display:
  - platform: it8951e
    id: m5paper_display
    cs_pin: GPIO15
    reset_pin: GPIO23
    busy_pin: GPIO27
    rotation: 270
    update_interval: never
    pages:
      
      # --- SIDE 1: 1. SAL ---
      - id: page_1st_sal
        lambda: |-
          it.fill(COLOR_OFF);
          draw_header(it, id(last_alert_icon), id(last_header_text), id(last_status_time), id(ha_time), id(font_emoji_small), id(font_calendar));
          
          it.print(270, 120, id(font_emoji_medium), COLOR_ON, TextAlign::CENTER, "🛏");
          it.print(270, 190, id(font_medium), COLOR_ON, TextAlign::CENTER, "1. SAL");
          if (id(temp_1st_sal).has_state()) it.printf(270, 290, id(font_large), COLOR_ON, TextAlign::CENTER, "%.1f °C", id(temp_1st_sal).state);
          if (id(bedroom_voc).has_state()) it.printf(270, 380, id(font_calendar), COLOR_ON, TextAlign::CENTER, "VOC: %.0f ppb", id(bedroom_voc).state);

          if (id(power_down_request)) {
            draw_alert_zone(it, "🏠", "Skal vi Sove?", "Godnat!", id(font_icon), id(font_medium));
          } else if (id(big_alert_active)) {
            draw_alert_zone(it, id(last_alert_icon).c_str(), id(last_header_text).c_str(), id(last_alert_text).c_str(), id(font_icon), id(font_medium));
          } else {
            draw_sleeping_pikachu(it);
          }

      # --- SIDE 2: STUEN ---
      - id: page_stuen
        lambda: |-
          it.fill(COLOR_OFF);
          draw_header(it, id(last_alert_icon), id(last_header_text), id(last_status_time), id(ha_time), id(font_emoji_small), id(font_calendar));
          
          it.print(270, 120, id(font_emoji_medium), COLOR_ON, TextAlign::CENTER, "🛋");
          it.print(270, 190, id(font_medium), COLOR_ON, TextAlign::CENTER, "STUEN");
          
          draw_climate_row(it, 260, "Stue", id(temp_stuen).state, id(target_temp_stue), id(climate_stue_mode).state.c_str(), id(font_small), id(font_medium));
          draw_climate_row(it, 435, "Køkken", id(temp_kokken).state, id(target_temp_kokken), id(climate_kokken_mode).state.c_str(), id(font_small), id(font_medium));
          draw_climate_row(it, 610, "Bad", id(temp_bad).state, id(target_temp_bad), id(climate_bad_mode).state.c_str(), id(font_small), id(font_medium));

          // Footer - Ventilate & CO2
          if (!id(big_alert_active) && !id(power_down_request)) {
            draw_button(it, 20, 840, 200, 100, "🪟 Luft ud", id(font_medium));
            if (id(co2_level).has_state()) {
               it.printf(330, 875, id(font_calendar), COLOR_ON, TextAlign::TOP_LEFT, "CO2: %.0f ppm", id(co2_level).state);
            }
          }

          if (id(power_down_request)) {
            draw_alert_zone(it, "🏠", "Skal vi Sove?", "Godnat!", id(font_icon), id(font_medium));
          } else if (id(big_alert_active)) {
            draw_alert_zone(it, id(last_alert_icon).c_str(), id(last_header_text).c_str(), id(last_alert_text).c_str(), id(font_icon), id(font_medium));
          } else {
            draw_sleeping_pikachu(it);
          }

      # --- SIDE 3: UDENFOR + I DAG ---
      - id: page_main 
        lambda: |-
          it.fill(COLOR_OFF);
          draw_header(it, id(last_alert_icon), id(last_header_text), id(last_status_time), id(ha_time), id(font_emoji_small), id(font_calendar));
          
          // TEMPERATUR
          if (id(temp_outdoor).has_state()) {
            it.printf(270, 140, id(font_large), COLOR_ON, TextAlign::CENTER, "%.1f °C", id(temp_outdoor).state);
            it.print(270, 220, id(font_calendar), COLOR_ON, TextAlign::CENTER, "Udendørs");
          }
          
          // FORECAST
          auto draw_fc = [&](int x, int y, std::string state, float temp, int offset) {
            std::string icon = "☁";
            if (state == "sunny" || state == "clear-day") icon = "☀";
            else if (state == "partlycloudy") icon = "⛅";
            else if (state == "rainy") icon = "🌧";
            else if (state == "pouring") icon = "🌧";
            else if (state == "snowy") icon = "🌨";
            else if (state == "snowy-rainy") icon = "🌨";
            else if (state == "lightning") icon = "🌩";
            else if (state == "lightning-rainy") icon = "🌩";
            else if (state == "fog") icon = "🌫";
            else if (state == "windy") icon = "🌬";
            else if (state == "windy-variant") icon = "💨";
            else if (state == "exceptional") icon = "✨";
            
            auto fc_time = id(ha_time).now();
            ESPTime t = ESPTime::from_epoch_local(fc_time.timestamp + offset * 3600);
            it.strftime(x, y, id(font_calendar), COLOR_ON, TextAlign::TOP_CENTER, "%H:00", t);
            
            it.print(x, y + 35, id(font_icon), COLOR_ON, TextAlign::TOP_CENTER, icon.c_str());
            it.printf(x, y + 105, id(font_calendar), COLOR_ON, TextAlign::TOP_CENTER, "%.0f°", temp);
          };
          draw_fc(110, 300, id(icon_1h).state, id(temp_1h).state, 1);
          draw_fc(270, 300, id(icon_2h).state, id(temp_2h).state, 2);
          draw_fc(430, 300, id(icon_3h).state, id(temp_3h).state, 3);

          it.line(30, 460, 510, 460); // Divider

          if (id(show_weather_forecast)) {
            // --- 5 DAY WEATHER VIEW ---
            it.print(270, 480, id(font_calendar), COLOR_ON, TextAlign::TOP_CENTER, "5-døgns prognose");
            
            // Draw Informative Pikachu (Left side, pointing right)
            draw_pikachu(it, 20, 780, pikachu_informative, 96, 120, false);

            if (id(weather_5day).has_state() && id(weather_5day).state.length() > 5) {
              std::string str = id(weather_5day).state;
              int x_pos = 55;
              size_t pos = 0;
              int items_drawn = 0;
              
              while (items_drawn < 5) {
                pos = str.find('|');
                std::string day_data = (pos == std::string::npos) ? str : str.substr(0, pos);
                
                if (day_data.length() > 3) {
                  size_t c1 = day_data.find(',');
                  size_t c2 = (c1 != std::string::npos) ? day_data.find(',', c1 + 1) : std::string::npos;
                  size_t c3 = (c2 != std::string::npos) ? day_data.find(',', c2 + 1) : std::string::npos;
                  
                  if (c1 != std::string::npos && c2 != std::string::npos && c3 != std::string::npos) {
                    std::string d_name = day_data.substr(0, c1);
                    std::string d_icon_key = day_data.substr(c1 + 1, c2 - c1 - 1);
                    std::string d_max = day_data.substr(c2 + 1, c3 - c2 - 1);
                    std::string d_min = day_data.substr(c3 + 1);

                    std::string icon = "☁";
                    if (d_icon_key == "sunny" || d_icon_key == "clear-day") icon = "☀";
                    else if (d_icon_key == "partlycloudy") icon = "⛅";
                    else if (d_icon_key == "rainy" || d_icon_key == "pouring") icon = "🌧";
                    else if (d_icon_key == "snowy") icon = "🌨";
                    
                    it.print(x_pos, 530, id(font_calendar), COLOR_ON, TextAlign::TOP_CENTER, d_name.c_str());
                    it.print(x_pos, 575, id(font_icon), COLOR_ON, TextAlign::TOP_CENTER, icon.c_str());
                    it.printf(x_pos, 655, id(font_calendar), COLOR_ON, TextAlign::TOP_CENTER, "%s°", d_max.c_str());
                    it.printf(x_pos, 695, id(font_calendar), COLOR_ON, TextAlign::TOP_CENTER, "%s°", d_min.c_str());
                  }
                }

                if (pos == std::string::npos) break;
                str.erase(0, pos + 1);
                x_pos += 105;
                items_drawn++;
              }
            } else {
              it.print(270, 580, id(font_calendar), COLOR_ON, TextAlign::TOP_CENTER, "Henter vejrdata...");
            }
          } else {
            // --- CALENDAR VIEW (Default) ---
            auto time = id(ha_time).now();
            const char* dage[] = {"", "Søndag", "Mandag", "Tirsdag", "Onsdag", "Torsdag", "Fredag", "Lørdag"};
            it.printf(270, 520, id(font_medium), COLOR_ON, TextAlign::CENTER, "%s d. %d.", dage[time.day_of_week], time.day_of_month);
            
            if (id(cal_today).has_state() && id(cal_today).state != "unknown") {
              std::string str = id(cal_today).state;
              int y = 580; 
              size_t pos = 0;
              while ((pos = str.find('|')) != std::string::npos) {
                it.print(270, y, id(font_calendar), COLOR_ON, TextAlign::TOP_CENTER, str.substr(0, pos).c_str());
                y += 45; // Increased spacing for size 32
                str.erase(0, pos + 1);
              }
              it.print(270, y, id(font_calendar), COLOR_ON, TextAlign::TOP_CENTER, str.c_str());
            }
          }

          if (id(power_down_request)) {
            draw_alert_zone(it, "🏠", "Skal vi Sove?", "Godnat!", id(font_icon), id(font_medium));
          } else if (id(big_alert_active)) {
            draw_alert_zone(it, id(last_alert_icon).c_str(), id(last_header_text).c_str(), id(last_alert_text).c_str(), id(font_icon), id(font_medium));
          } else {
            draw_sleeping_pikachu(it);
          }

      # --- SIDE 4: UGENS KALENDER ---
      - id: page_cal_week
        lambda: |-
          it.fill(COLOR_OFF);
          draw_header(it, id(last_alert_icon), id(last_header_text), id(last_status_time), id(ha_time), id(font_emoji_small), id(font_calendar));
          
          it.print(270, 120, id(font_emoji_medium), COLOR_ON, TextAlign::CENTER, "📅");
          auto tomorrow = ESPTime::from_epoch_local(id(ha_time).now().timestamp + 86400);
          it.printf(270, 190, id(font_medium), COLOR_ON, TextAlign::CENTER, "UGE %s", tomorrow.strftime("%V").c_str());
          it.line(0, 260, 540, 260); 
          
          if (id(cal_week).has_state() && id(cal_week).state != "unknown") {
            std::string str = id(cal_week).state;
            int y = 290; 
            size_t pos = 0;
            while ((pos = str.find('|')) != std::string::npos) {
              it.print(20, y, id(font_calendar), COLOR_ON, TextAlign::TOP_LEFT, str.substr(0, pos).c_str());
              y += 45; // Increased spacing for size 32
              str.erase(0, pos + 1);
            }
            it.print(20, y, id(font_calendar), COLOR_ON, TextAlign::TOP_LEFT, str.c_str());
          }

          if (id(power_down_request)) {
            draw_alert_zone(it, "🏠", "Skal vi Sove?", "Godnat!", id(font_icon), id(font_medium));
          } else if (id(big_alert_active)) {
            draw_alert_zone(it, id(last_alert_icon).c_str(), id(last_header_text).c_str(), id(last_alert_text).c_str(), id(font_icon), id(font_medium));
          } else {
            draw_sleeping_pikachu(it);
          }


interval:
  - interval: 1min
    then:
      - component.update: m5paper_display
