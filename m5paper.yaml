  - file: "FreeSans.ttf"
    id: font_medium
    size: 48
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ 0123456789.,:;!?-+/()[]{}<>%&@#_æøåÆØÅ°"

  - file: "FreeSans.ttf"
