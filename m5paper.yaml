esphome:
  name: stue-panel
  friendly_name: Stue Panel
  
  platformio_options:
    build_flags:
      - -DBOARD_HAS_PSRAM
      - -mfix-esp32-psram-cache-issue

  includes:
    - display_helpers.h
    - helper_assistant/pikachu_happy.h
    - helper_assistant/pikachu_angry.h
    - helper_assistant/pikachu_informative.h
    - helper_assistant/pikachu_sleep.h
    - helper_assistant/pikachu_excited.h

  on_boot:
    - priority: -100.0 
      then:
        - bm8563.read_time:
            id: rtc_time
        - delay: 2s
        - it8951e.clear: m5paper_display
        - display.page.show: page_main
        - component.update: m5paper_display

esp32:
  board: m5stack_paper
  framework:
    type: arduino

external_components:
  - source: custom_components 

logger:
  level: INFO

api:
  id: ha_api
  encryption:
    key: "N2YxMzRhYzY4YjVkMzU1ZTQ5Mzg3MmExOTI4MzY0ZGU="

ota:
  - platform: esphome

wifi:
  ssid: "Yellow Submarine"
  password: "Hansen28102017"

psram:

i2c:
  sda: GPIO21
  scl: GPIO22

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO12
  miso_pin: GPIO13

# --- FONTS ---
